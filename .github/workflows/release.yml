# Publishes to npm from CI with a provenance statement, which n8n requires
# for verified community nodes (local publishes rejected since 2026-05-01).
# Auth: granular NPM_TOKEN repo secret scoped to this one package.
# (Token-less Trusted Publishing was attempted first and the registry
# refused the OIDC exchange despite matching config — see runs 2-5.)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
