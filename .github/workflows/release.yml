# Publishes to npm from CI with a provenance statement, which n8n requires
# for verified community nodes (local publishes rejected since 2026-05-01).
# Token-less: npm Trusted Publishing (OIDC) — the package settings on
# npmjs.com name this repo and this workflow file.
# npm is PINNED to 11: Node 22 bundles npm 10 (no OIDC), and npm 12.0.x
# regressed the exchange (ENEEDAUTH with valid config — see runs 2-5).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: it writes an .npmrc placeholder _authToken that
      # preempts the OIDC exchange (actions/setup-node#1551).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
