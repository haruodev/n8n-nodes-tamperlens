# Publishes to npm with a provenance statement, which n8n requires for
# verified community nodes (local-machine publishes are rejected since
# 2026-05-01). Token-less: npm Trusted Publishing must name this repo and
# this workflow file in the package's settings on npmjs.com — no NPM_TOKEN
# secret exists or is needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: that option writes an .npmrc with a placeholder
      # _authToken, and npm then presents the placeholder instead of doing
      # the OIDC exchange. Trusted publishing wants NO configured auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 bundles npm 10; token-less Trusted Publishing (OIDC) needs npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
